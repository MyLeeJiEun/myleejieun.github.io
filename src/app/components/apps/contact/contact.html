<div class="w-full h-full bg-ub-grey text-white overflow-y-auto windowMainScreen">
  <div class="w-full max-w-3xl mx-auto px-4 md:px-8 py-8 md:py-12">
    <h2 class="text-xl md:text-2xl font-light text-white mb-8 md:mb-12 text-center">联系</h2>
    <div class="space-y-8 md:space-y-10">
      <div class="border-l-2 border-white border-opacity-20 pl-6 md:pl-8">
        <p class="text-xs md:text-sm text-gray-400 mb-2 font-light uppercase tracking-wider">邮箱</p>
        <a [href]="'mailto:' + contact.email" class="text-white hover:text-gray-300 transition-colors text-base md:text-lg font-light block">
          {{ contact.email }}
        </a>
      </div>

      <div class="border-l-2 border-white border-opacity-20 pl-6 md:pl-8">
        <p class="text-xs md:text-sm text-gray-400 mb-2 font-light uppercase tracking-wider">电话</p>
        <a [href]="'tel:' + contact.phone" class="text-white hover:text-gray-300 transition-colors text-base md:text-lg font-light block">
          {{ contact.phone }}
        </a>
      </div>

      <div class="border-l-2 border-white border-opacity-20 pl-6 md:pl-8">
        <p class="text-xs md:text-sm text-gray-400 mb-2 font-light uppercase tracking-wider">博客</p>
        <a [href]="contact.websiteUrl" target="_blank" rel="noopener noreferrer" class="text-white hover:text-gray-300 transition-colors text-base md:text-lg font-light block">
          {{ contact.websiteLabel }}
        </a>
      </div>
      
      <div class="border-l-2 border-white border-opacity-20 pl-6 md:pl-8">
        <p class="text-xs md:text-sm text-gray-400 mb-2 font-light uppercase tracking-wider">GitHub</p>
        <a [href]="contact.githubUrl" target="_blank" rel="noopener noreferrer" class="text-white hover:text-gray-300 transition-colors text-base md:text-lg font-light block">
          {{ contact.githubLabel }}
        </a>
      </div>

      <div class="border-l-2 border-white border-opacity-20 pl-6 md:pl-8">
        <p class="text-xs md:text-sm text-gray-400 mb-2 font-light uppercase tracking-wider">地区</p>
        <p class="text-white text-base md:text-lg font-light block">{{ contact.location }}</p>
      </div>
      
      <div class="border-l-2 border-white border-opacity-20 pl-6 md:pl-8 pt-2">
        <p class="text-xs md:text-sm text-gray-400 mb-4 font-light uppercase tracking-wider">说明</p>
        <ul class="list-none space-y-2">
          @for (note of notes; track note) {
            <li class="flex items-start">
              <span class="text-white mr-3 mt-1">•</span>
              <span class="text-sm md:text-base text-gray-300 flex-1">{{ note }}</span>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</div>
